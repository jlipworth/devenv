# versions.conf
# Pinned versions for major dependencies
# Change values here and rebuild to update
# Update these manually, then rebuild/verify

# Emacs version
EMACS_VERSION="30.2"

# GCC version for Linux native compilation
# Set to "auto" to detect highest available, or pin like "14"
GCC_VERSION="auto"

# Node.js version (installed via nvm)
# Use "lts" for latest LTS or specific version like "22"
NODE_VERSION="26"

# Alacritty version (used for Windows portable fallback)
ALACRITTY_VERSION="0.16.1"

# Neovim version (used for the default Unix source-build path)
NEOVIM_VERSION="0.12.5"

# Minimum Neovim version accepted by the installers.
# VimTeX refuses to load below 0.12.4, so that is the floor for the LaTeX layer.
NEOVIM_MIN_VERSION="0.12.4"
