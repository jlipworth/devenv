# versions.conf
# Pinned versions for major dependencies
# Change values here and rebuild to update
# Renovate opens PRs for the pins marked `# renovate:`; others are updated by
# hand. Rebuild/verify after any change.

# Emacs version. The tarball is checked against EMACS_SHA256, so update both
# together (verify the new release's .sig with the GNU keyring first).
EMACS_VERSION="30.2"
EMACS_SHA256="1d79a4ba4d6596f302a7146843fe59cf5caec798190bcc07c907e7ba244b076d"

# GCC version for Linux native compilation
# Set to "auto" to detect highest available, or pin like "14"
GCC_VERSION="auto"

# Node.js version (installed via nvm)
# Use "lts" for latest LTS or specific version like "22"
# renovate: datasource=node-version depName=node versioning=node
NODE_VERSION="26"

# Alacritty version (used for Windows portable fallback)
# renovate: datasource=github-releases depName=alacritty/alacritty extractVersion=^v(?<version>.+)$
ALACRITTY_VERSION="0.16.1"

# Neovim version (used for the default Unix source-build path)
# renovate: datasource=github-releases depName=neovim/neovim extractVersion=^v(?<version>\d+\.\d+\.\d+)$
NEOVIM_VERSION="0.12.5"

# Minimum Neovim version accepted by the installers.
# VimTeX refuses to load below 0.12.4, so that is the floor for the LaTeX layer.
NEOVIM_MIN_VERSION="0.12.4"
