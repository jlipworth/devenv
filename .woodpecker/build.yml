# .woodpecker/build.yml
# Core Emacs build, Spacemacs compatibility, and sequential Neovim source-build test

# Branch pushes are covered by their pull request. A weekly cron runs every
# workflow regardless of paths, so drift outside these files is still caught.
when:
  - event: push
    branch: master
    path: &paths
      include:
        - build_emacs30.sh
        - build_neovim.sh
        - common_utils.sh
        - prereq_packages.sh
        - versions.conf
        - makefile
        - .spacemacs
        - jal-functions.el
        - snippets/**
        - nvim/**
        - ci/neovim-smoke.sh
        - ci/nvim-wait-for-mason.lua
        - ci/spacemacs-smoke.sh
        - .woodpecker/build.yml
  - event: pull_request
    path: *paths
  - event: manual
  - event: cron
    cron: weekly

variables:
  - &gcc_version "12"
  - &emacs_image "debian:bookworm-slim"

steps:
  - name: build-and-verify-emacs
    image: *emacs_image
    environment:
      DEBIAN_FRONTEND: noninteractive
      CI: "true"
      CI_INSTALL: "true"
      GCC_VERSION: *gcc_version
    # The Emacs build is the slowest step; skip it when only Neovim or the
    # shared installer changed. Manual and cron runs ignore paths.
    when:
      - event: [push, pull_request]
        path:
          include:
            - build_emacs30.sh
            - common_utils.sh
            - versions.conf
            - .spacemacs
            - jal-functions.el
            - snippets/**
            - ci/spacemacs-smoke.sh
            - .woodpecker/build.yml
      - event: [manual, cron]
    commands:
      - set -ex
      - chmod +x build_emacs30.sh common_utils.sh || true
      - ./build_emacs30.sh
      - echo "=== Build complete, verifying Emacs ==="
      - |
          export PATH="$HOME/.local/bin:$PATH"
          test -x "$HOME/.local/bin/emacs"
          "$HOME/.local/bin/emacs" --version
      - echo "=== Loading Spacemacs with the tracked .spacemacs ==="
      # Same Spacemacs branch build_emacs30.sh installs (SPACEMACS_BRANCH).
      - git clone --depth 1 --branch working https://github.com/jlipworth/spacemacs ~/.emacs.d
      - ln -sf "$PWD/.spacemacs" ~/.spacemacs
      # vterm compiles its module on load; pdf-tools builds epdfinfo.
      - >-
        apt-get install -y --no-install-recommends curl libtool-bin
        libpoppler-glib-dev libpng-dev zlib1g-dev
      - ./ci/spacemacs-smoke.sh "$HOME/.local/bin/emacs" ~/.emacs.d

  - name: build-and-verify-neovim
    image: *emacs_image
    # Runs after Emacs to limit peak load on the node, or alone when the
    # Emacs step was skipped.
    depends_on:
      - name: build-and-verify-emacs
        optional: true
    environment:
      DEBIAN_FRONTEND: noninteractive
      CI: "true"
      CI_INSTALL: "true"
    commands:
      - set -ex
      - apt-get update
      - apt-get install -y --no-install-recommends make nodejs npm python3 python3-pip python3-venv
      - chmod +x build_neovim.sh common_utils.sh ci/neovim-smoke.sh || true
      - echo "=== Running Neovim source-build smoke after Emacs ==="
      - NVIM_INSTALL_MODE=source ./ci/neovim-smoke.sh
      - echo "=== Neovim source-build smoke passed! ==="
