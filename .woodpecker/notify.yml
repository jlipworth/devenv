# .woodpecker/notify.yml
# Single Discord notification after the other workflows complete.
# Always runs so GitHub sees one final status, never leaves PENDING.

# Same events as lint.yml, which always runs. The other workflows may be
# skipped by their path filters, so they are optional dependencies.
when:
  - event: push
    branch: master
    status: [success, failure]
  - event: [pull_request, manual]
    status: [success, failure]
  - event: cron
    cron: weekly
    status: [success, failure]


depends_on:
  - lint
  - name: build
    optional: true
  - name: layers
    optional: true
  - name: noadmin
    optional: true

steps:
  # One step for both outcomes: step-level status filters only see this
  # workflow, which always succeeds, so the result comes from GitHub statuses.
  - name: notify
    image: python:3.14-alpine
    environment:
      DISCORD_ID:
        from_secret: discord_id
      DISCORD_TOKEN:
        from_secret: discord_token
    commands:
      - python3 ci/notify-discord.py
