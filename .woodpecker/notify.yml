# .woodpecker/notify.yml
# Single Discord notification after dependent pipelines complete.
# Always runs so GitHub sees one final status, never leaves PENDING.

# Same events as lint.yml, which always runs. The other workflows may be
# skipped by their path filters, so they are optional dependencies.
when:
  - event: push
    branch: master
    status: [success, failure]
  - event: [pull_request, manual]
    status: [success, failure]
  - event: cron
    cron: weekly
    status: [success, failure]

skip_clone: true

depends_on:
  - lint
  - name: build
    optional: true
  - name: layers
    optional: true
  - name: noadmin
    optional: true

steps:
  - name: notify-success
    image: appleboy/drone-discord
    when:
      status: [success]
    settings:
      webhook_id:
        from_secret: discord_id
      webhook_token:
        from_secret: discord_token
      message: >
        ✅ **Success**: {{repo.name}} ({{commit.branch}})
        {{commit.message}}
        {{build.link}}

  - name: notify-failure
    image: appleboy/drone-discord
    when:
      status: [failure]
    settings:
      webhook_id:
        from_secret: discord_id
      webhook_token:
        from_secret: discord_token
      message: >
        ❌ **Failed**: {{repo.name}} ({{commit.branch}})
        {{commit.message}}
        {{build.link}}
