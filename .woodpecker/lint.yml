# .woodpecker/lint.yml
# Shell script linting

# Branch pushes are covered by their pull request. Lint and the fast specs run
# on every change; they are cheap and notify.yml depends on this workflow.
when:
  - event: push
    branch: master
  - event: [pull_request, manual]
  - event: cron
    cron: weekly

steps:
  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    commands:
      - >-
        shellcheck --source-path=SCRIPTDIR -x
        *.sh bin/*.sh ci/*.sh tests/*.sh tests/*/*.sh notifications/backends/*.sh
        bin/emacs-macos-wrapper bin/setup-claugpt bin/tmux-pop-pane
        ci/macos-brew-readonly ci/macos-sudo-deny notifications/ai-notify-*
      - ./check_codex_config.sh

  - name: macos-runner-policy
    image: python:3.14-alpine
    commands:
      - python3 ci/validate-macos-pipeline.py .woodpecker/macos.yml --default-branch master

  # Script-level specs that mock their tools; no installs, so they run on
  # every change instead of waiting for the heavy layer workflows.
  - name: specs
    image: jlipworth/gnu-files-ci:2026.10.06
    environment:
      CI: "true"
    commands:
      - ./tests/codex_config_spec.sh
      - ./tests/ai_tools_spec.sh
      - ./tests/claude_safari_mcp_spec.sh
      - ./tests/claude_settings_defaults_spec.sh
      - ./tests/ci/macos_ci_spec.sh
