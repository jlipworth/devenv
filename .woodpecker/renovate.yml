# .woodpecker/renovate.yml
# Renovate bot - scans GitHub repo and creates PRs for dependency updates
# Runs on the "renovate" cron only (configured in Woodpecker: Mondays 14:00 UTC)

when:
  event: cron
  cron: renovate

steps:
  - name: renovate
    image: renovate/renovate:latest
    environment:
      RENOVATE_TOKEN:
        from_secret: github_pat
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: jlipworth/devenv
      RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@noreply.github.com>"
      LOG_LEVEL: info
    commands:
      - renovate

  - name: notify-renovate
    image: appleboy/drone-discord
    depends_on:
      - renovate
    settings:
      webhook_id:
        from_secret: discord_id
      webhook_token:
        from_secret: discord_token
      message: >
        🔄 **Renovate** completed for {{repo.name}}
        Check for new dependency update PRs
        {{build.link}}
