# .woodpecker/renovate.yml
# Renovate bot - scans GitHub repo and creates PRs for dependency updates
# Runs on the "renovate" cron only (configured in Woodpecker: Mondays 14:00 UTC)

when:
  event: cron
  cron: renovate

steps:
  - name: renovate
    image: renovate/renovate:latest
    environment:
      RENOVATE_TOKEN:
        from_secret: github_pat
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: jlipworth/devenv
      RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@noreply.github.com>"
      # TEMPORARY: debug to surface the real error behind repository-changed aborts.
      LOG_LEVEL: debug
      # Exit non-zero when the repo run ends in a known error state (e.g.
      # repository-changed -> 6), so a broken run turns the step red instead
      # of passing silently. Experimental option; see Renovate self-hosted docs.
      RENOVATE_EXIT_CODE_FOR_ERRORS: "true"
    commands:
      - renovate

  - name: notify-renovate
    image: appleboy/drone-discord
    depends_on:
      - renovate
    when:
      status: [success, failure]
    settings:
      webhook_id:
        from_secret: discord_id
      webhook_token:
        from_secret: discord_token
      message: >
        🔄 **Renovate** {{build.status}} for {{repo.name}}
        Check for new dependency update PRs (or the failure log)
        {{build.link}}
