# .woodpecker/noadmin.yml
# NO_ADMIN smoke tests.
#
# These jobs intentionally run in a non-root image without passwordless sudo.
# Goal: confirm that NO_ADMIN=true:
# - avoids privileged package-manager flows
# - skips system-only integration cleanly
# - reports partial setup honestly
#
# This is not a full replacement for the existing layer CI. It complements:
# - .woodpecker/build.yml
# - .woodpecker/layers.yml
#
# Notes:
# - We keep this lightweight on purpose.
# - This image mirrors the intended work-machine case: no sudo at runtime, but Homebrew is preinstalled.
# - Steps run under the image's /bin/sh (dash), which has no pipefail, so each
#   `cmd | tee log` runs in bash -o pipefail to keep cmd's exit status.

# Branch pushes are covered by their pull request. Changes that cannot affect
# the installers (docs, Windows and macOS-only files, other workflows) skip
# this workflow; the weekly cron runs it regardless.
when:
  - event: push
    branch: master
    path: &paths
      exclude:
        - "**/*.md"
        - docs/**
        - LICENSE
        - .claude/**
        - "*.ps1"
        - alacritty.windows.toml
        - renovate.json
        - .pre-commit-config.yaml
        - .woodpecker/build.yml
        - .woodpecker/lint.yml
        - .woodpecker/macos.yml
        - .woodpecker/notify.yml
        - .woodpecker/renovate.yml
        - .woodpecker/layers.yml
        - ci/macos-*
        - ci/spacemacs-smoke.sh
        - ci/validate-macos-pipeline.py
        - tests/**
  - event: pull_request
    path: *paths
  - event: manual
  - event: cron
    cron: weekly

variables:
  - &noadmin_image "jlipworth/gnu-files-noadmin:latest"

steps:
  - name: noadmin-cli-tools
    image: *noadmin_image
    depends_on: []
    environment:
      CI: "true"
      NO_ADMIN: "true"
      DEBIAN_FRONTEND: noninteractive
    commands:
      - set -eu
      - bash -o pipefail -c 'make cli_tools 2>&1 | tee cli_tools.log'
      - 'grep -q "NO_ADMIN=true: skipping CLI system-integration extras" cli_tools.log'
      - grep -q "Shell syntax highlighting setup complete" cli_tools.log
      - test -d "$HOME/.tmux"
      - command -v starship

  - name: noadmin-r
    image: *noadmin_image
    depends_on: []
    environment:
      CI: "true"
      NO_ADMIN: "true"
      DEBIAN_FRONTEND: noninteractive
    commands:
      - set -eu
      - bash -o pipefail -c 'make r 2>&1 | tee r.log'
      - command -v brew
      - grep -q "Installing R via Homebrew/Linuxbrew" r.log

  - name: noadmin-latex-tooling
    image: *noadmin_image
    depends_on: []
    environment:
      CI: "true"
      NO_ADMIN: "true"
      DEBIAN_FRONTEND: noninteractive
    commands:
      - set -eu
      - bash -o pipefail -c 'make latex_tooling 2>&1 | tee latex_tooling.log'
      - command -v texlab

  - name: noadmin-system-prereq
    image: *noadmin_image
    depends_on: []
    environment:
      CI: "true"
      NO_ADMIN: "true"
      DEBIAN_FRONTEND: noninteractive
    commands:
      - set -eu
      - bash -o pipefail -c 'make system-prereq 2>&1 | tee system_prereq.log'
      - command -v brew
      - 'grep -q "NO_ADMIN=true: skipping ksshaskpass" system_prereq.log'
      - grep -q "Node.js v" system_prereq.log
      - grep -q "Shell syntax highlighting setup complete" system_prereq.log
      - command -v starship
      - test -d "$HOME/.nvm"

  - name: noadmin-neovim
    image: *noadmin_image
    depends_on: []
    environment:
      CI: "true"
      NO_ADMIN: "true"
      DEBIAN_FRONTEND: noninteractive
      HOMEBREW_NO_AUTO_UPDATE: "1"
      NVIM_INSTALL_MODE: package
    commands:
      - set -eu
      # Source builds need sudo-installed toolchains, so NO_ADMIN uses the
      # package/download path (make neovim-package) via the smoke script.
      - bash -o pipefail -c './ci/neovim-smoke.sh 2>&1 | tee neovim.log'
      - 'grep -q "Neovim smoke passed" neovim.log'

# Future follow-up:
# - consider adding a slower/manual full `make latex` job once the
#   slim TeX Live package set is settled
