# .woodpecker/layers.yml
# Language/editor layer tests - run in parallel
# All use the pre-built CI image with dependencies already installed

# Branch pushes are covered by their pull request. Changes that cannot affect
# the installers (docs, Windows and macOS-only files, other workflows) skip
# this workflow; the weekly cron runs it regardless.
when:
  - event: push
    branch: master
    path: &paths
      exclude:
        - "**/*.md"
        - docs/**
        - LICENSE
        - .claude/**
        - "*.ps1"
        - alacritty.windows.toml
        - renovate.json
        - .pre-commit-config.yaml
        - .woodpecker/build.yml
        - .woodpecker/lint.yml
        - .woodpecker/macos.yml
        - .woodpecker/notify.yml
        - .woodpecker/renovate.yml
        - .woodpecker/noadmin.yml
        - ci/macos-*
        - ci/spacemacs-smoke.sh
        - ci/validate-macos-pipeline.py
        - tests/**
  - event: pull_request
    path: *paths
  - event: manual
  - event: cron
    cron: weekly

variables:
  - &ci_image "jlipworth/gnu-files-ci:latest"

steps:
  - name: layer-editor
    image: *ci_image
    depends_on: []
    environment:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
    commands:
      - make editor

  - name: layer-shell
    image: *ci_image
    depends_on: []
    environment:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
    commands:
      - make shell-layer

